<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calenda en honor a la Virgen de Juquila</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #fffaf2;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* PORTADA Y TRANSICIÓN */

#portada {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    z-index: 5000;
    background: #000;
    cursor: pointer;
    overflow: hidden;
    transition: opacity 1s ease, transform 1s ease;
}

#portada > img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#portada.oculta {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
}

/* GIRASOLES */

#animacionGirasoles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.girasol-trazo {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation: dibujar 1.8s ease forwards;
}

.girasol-relleno {
    opacity: 0;
    animation: aparecer .7s ease forwards;
}

@keyframes dibujar {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes aparecer {
    to {
        opacity: 1;
    }
}

/* CONTENIDO */

#contenido {
    position: relative;
    width: 100%;
    opacity: 0;
    transform: translateY(25px);
    transition: opacity 1s ease, transform 1s ease;
}

#contenido.visible {
    opacity: 1;
    transform: translateY(0);
}

/* IMÁGENES */

.seccion {
    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
}

.seccion img {
    display: block;
    width: 100%;
    height: auto;
}

/* DETALLES */

#seccionDetalles {
    position: relative;
    line-height: normal;
}

/* ENLACE DE GOOGLE MAPS */

#zonaMapa {
    position: absolute;
    top: 80%;
    left: 50%;
    width: 35%;
    height: 13%;
    transform: translate(-50%, -50%);
    display: block;
    z-index: 30;
    cursor: pointer;
}

/* CRONÓMETRO */

.cronometro {
    position: absolute;
    top: 88%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 92%;
    max-width: 650px;
    padding: 18px 12px;
    text-align: center;
    color: #76572c;
    background: rgba(255, 247, 232, .88);
    border-radius: 14px;
    z-index: 20;
    line-height: normal;
}

.cronometro h2 {
    font-family: Georgia, serif;
    font-size: clamp(18px, 4.5vw, 30px);
    margin-bottom: 8px;
}

.cronometro p {
    font-size: clamp(11px, 2.8vw, 14px);
    margin-bottom: 15px;
}

.contador {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 600px;
    margin: auto;
}

.bloque {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 4px;
    border-radius: 10px;
    background: #8b6938;
    color: white;
}

.numero {
    font-size: clamp(20px, 5.5vw, 38px);
    font-weight: bold;
    line-height: 1.2;
}

.texto {
    margin-top: 5px;
    font-size: clamp(8px, 2.2vw, 12px);
    font-weight: bold;
    letter-spacing: .4px;
}

/* CRÉDITOS */

.creditos {
    width: 100%;
    text-align: center;
    background: #fff7e8;
    padding: 25px 15px 35px;
    color: #76572c;
    line-height: 1.6;
}

.creditos p {
    margin: 5px 0;
    font-size: 14px;
}

.creditos .marca {
    color: #9a742f;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
}

.creditos a {
    color: #76572c;
    text-decoration: none;
    font-weight: bold;
}

/* BOTÓN DE MÚSICA */

#botonMusica {
    position: fixed;
    right: 15px;
    bottom: 15px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid #c9a45b;
    background: #80602c;
    color: white;
    font-size: 20px;
    z-index: 4000;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
}

/* PÉTALOS BLANCOS */

#petalos {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3000;
    overflow: hidden;
}

.petalo {
    position: absolute;
    top: -40px;
    width: 13px;
    height: 19px;
    background: rgba(255,255,255,.85);
    border-radius: 80% 20% 80% 20%;
    animation: caer linear infinite;
    filter: blur(.2px);
}

@keyframes caer {
    0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 0;
    }

    10%, 90% {
        opacity: .9;
    }

    100% {
        transform: translateY(110vh) rotate(500deg);
        opacity: 0;
    }
}

/* CELULARES */

@media(max-width:600px) {

    .cronometro {
        width: 94%;
        padding: 12px 7px;
    }

    .contador {
        gap: 5px;
    }

    .bloque {
        padding: 9px 2px;
    }

    #botonMusica {
        width: 42px;
        height: 42px;
        right: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<!-- PORTADA INICIAL -->

<div id="portada" onclick="abrirInvitacion()">

    <img src="portada.jpg" alt="Portada de la Calenda">

    <svg id="animacionGirasoles"
         viewBox="0 0 1000 1000"
         preserveAspectRatio="xMidYMid meet">
    </svg>

</div>

<!-- MÚSICA -->

<audio id="musica" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="botonMusica" onclick="toggleMusica(event)">
    ♫
</button>

<!-- PÉTALOS -->

<div id="petalos"></div>

<!-- INVITACIÓN -->

<main id="contenido">

    <!-- SEGUNDA IMAGEN -->

    <section class="seccion">

        <img src="contexto.jpg"
             alt="Invitación y madrinas de la Calenda">

    </section>

    <!-- DETALLES -->

    <section class="seccion" id="seccionDetalles">

        <img src="detalles.jpg"
             alt="Detalles de la celebración">

        <!-- BOTÓN INVISIBLE DE GOOGLE MAPS -->

        <a id="zonaMapa"
           href="https://maps.app.goo.gl/kqMWNPBSazHsArkt8"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Abrir ubicación en Google Maps">
        </a>

        <!-- CRONÓMETRO -->

        <div class="cronometro">

            <h2>¡La espera está por terminar!</h2>

            <p>
                Nos vemos el 27 de noviembre de 2026 a las 6:00 p. m.
            </p>

            <div class="contador">

                <div class="bloque">
                    <span class="numero" id="dias">0</span>
                    <span class="texto">DÍAS</span>
                </div>

                <div class="bloque">
                    <span class="numero" id="horas">00</span>
                    <span class="texto">HORAS</span>
                </div>

                <div class="bloque">
                    <span class="numero" id="minutos">00</span>
                    <span class="texto">MINUTOS</span>
                </div>

                <div class="bloque">
                    <span class="numero" id="segundos">00</span>
                    <span class="texto">SEGUNDOS</span>
                </div>

            </div>

        </div>

    </section>

    <!-- CRÉDITOS -->

    <footer class="creditos">

        <p>INVITACIÓN CREADA POR</p>

        <p class="marca">✦ MOON GRAFIK ✦</p>

        <p>
            WhatsApp:
            <a href="https://wa.me/524426070366"
               target="_blank"
               rel="noopener noreferrer">
                44 26 07 03 66
            </a>
        </p>

    </footer>

</main>

<script>

/* ABRIR INVITACIÓN */

let invitacionAbierta = false;

function abrirInvitacion() {

    if (invitacionAbierta) return;

    invitacionAbierta = true;

    const musica = document.getElementById("musica");
    const portada = document.getElementById("portada");
    const contenido = document.getElementById("contenido");

    musica.currentTime = 0;
    musica.volume = 1;

    musica.play().catch(function() {
        console.log("El navegador no pudo iniciar la música.");
    });

    iniciarGirasoles();

    setTimeout(function() {

        portada.classList.add("oculta");

        setTimeout(function() {

            contenido.classList.add("visible");

            crearPetalos();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }, 700);

        setTimeout(function() {
            portada.style.display = "none";
        }, 1100);

    }, 6500);
}

/* BOTÓN DE MÚSICA */

function toggleMusica(event) {

    event.stopPropagation();

    const musica = document.getElementById("musica");
    const boton = document.getElementById("botonMusica");

    if (musica.paused) {

        musica.play().then(function() {
            boton.textContent = "♫";
        }).catch(function() {
            console.log("No se pudo reproducir la música.");
        });

    } else {

        musica.pause();
        boton.textContent = "♪";

    }
}

/* DIBUJAR GIRASOLES */

function iniciarGirasoles() {

    const svg = document.getElementById("animacionGirasoles");

    if (svg.dataset.iniciado) return;

    svg.dataset.iniciado = "si";

    const NS = "http://www.w3.org/2000/svg";

    function crearElemento(tipo, atributos, clase, retraso) {

        const elemento = document.createElementNS(NS, tipo);

        Object.entries(atributos).forEach(function([nombre, valor]) {
            elemento.setAttribute(nombre, valor);
        });

        elemento.setAttribute("class", clase);
        elemento.style.animationDelay = retraso + "s";

        svg.appendChild(elemento);
    }

    const flores = [
        { x: 200, y: 350, escala: 1 },
        { x: 500, y: 300, escala: 1.05 },
        { x: 800, y: 350, escala: 1 }
    ];

    flores.forEach(function(flor, indice) {

        const x = flor.x;
        const y = flor.y;
        const escala = flor.escala;
        const retrasoFlor = indice * .45;

        /* TALLO */

        crearElemento("path", {
            d: `M ${x} 900 Q ${x-12} 650 ${x} ${y+30}`,
            stroke: "#228B22",
            "stroke-width": 13 * escala
        }, "girasol-trazo", retrasoFlor);

        /* HOJAS */

        crearElemento("path", {
            d: `M ${x} 700 Q ${x-90} 620 ${x-110} 690 Q ${x-75} 755 ${x} 700 Z`,
            fill: "#228B22"
        }, "girasol-relleno", retrasoFlor + 1.4);

        crearElemento("path", {
            d: `M ${x} 700 Q ${x-60} 680 ${x-95} 690`,
            stroke: "#145214",
            "stroke-width": 3
        }, "girasol-trazo", retrasoFlor + 1.5);

        crearElemento("path", {
            d: `M ${x} 610 Q ${x+85} 530 ${x+110} 590 Q ${x+90} 655 ${x} 610 Z`,
            fill: "#228B22"
        }, "girasol-relleno", retrasoFlor + 1.8);

        crearElemento("path", {
            d: `M ${x} 610 Q ${x+60} 600 ${x+95} 590`,
            stroke: "#145214",
            "stroke-width": 3
        }, "girasol-trazo", retrasoFlor + 1.9);

        /* PÉTALOS */

        for (let i = 0; i < 12; i++) {

            const angulo = (Math.PI * 2 * i) / 12;

            const px = x + Math.cos(angulo) * 62 * escala;
            const py = y + Math.sin(angulo) * 62 * escala;

            crearElemento("ellipse", {
                cx: px,
                cy: py,
                rx: 36 * escala,
                ry: 12 * escala,
                fill: "#FFD700",
                transform: `rotate(${angulo * 180 / Math.PI} ${px} ${py})`
            }, "girasol-relleno", retrasoFlor + 2.1 + i * .12);

        }

        /* CENTRO CAFÉ */

        crearElemento("circle", {
            cx: x,
            cy: y,
            r: 45 * escala,
            fill: "#8B4513"
        }, "girasol-relleno", retrasoFlor + 4);

        crearElemento("circle", {
            cx: x,
            cy: y,
            r: 25 * escala,
            fill: "#654321"
        }, "girasol-relleno", retrasoFlor + 4.2);

    });
}

/* PÉTALOS BLANCOS */

function crearPetalos() {

    const contenedor = document.getElementById("petalos");

    if (contenedor.dataset.creados) return;

    contenedor.dataset.creados = "si";

    for (let i = 0; i < 28; i++) {

        const petalo = document.createElement("div");

        petalo.className = "petalo";

        petalo.style.left = Math.random() * 100 + "%";

        petalo.style.animationDuration =
            (6 + Math.random() * 8) + "s";

        petalo.style.animationDelay =
            (Math.random() * 8) + "s";

        petalo.style.opacity =
            .4 + Math.random() * .5;

        petalo.style.transform =
            `scale(${.5 + Math.random()})`;

        contenedor.appendChild(petalo);

    }
}

/* CUENTA REGRESIVA */

const fechaEvento = new Date(
    2026, 10, 27, 18, 0, 0
).getTime();

function actualizarContador() {

    const diferencia = fechaEvento - Date.now();

    if (diferencia <= 0) {

        document.getElementById("dias").textContent = "0";
        document.getElementById("horas").textContent = "00";
        document.getElementById("minutos").textContent = "00";
        document.getElementById("segundos").textContent = "00";

        return;
    }

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia / (1000 * 60 * 60)) % 24
    );

    const minutos = Math.floor(
        (diferencia / (1000 * 60)) % 60
    );

    const segundos = Math.floor(
        (diferencia / 1000) % 60
    );

    document.getElementById("dias").textContent = dias;

    document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");

    document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");

    document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");
}

actualizarContador();

setInterval(actualizarContador, 1000);

</script>

</body>
</html>
<p><a href="AQUI_TU_ENLACE"
target="_black">https://maps.app.goo.gl/kqMWNPBSazHsArkt8</a></p>       
</body>
</html>
