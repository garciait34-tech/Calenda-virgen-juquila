
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virgen de Juquila</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #06182d;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================
   PORTADA
========================= */

#portada {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    z-index: 5000;
    background: #000;
    cursor: pointer;
    overflow: hidden;
    opacity: 1;
    visibility: visible;
    transition: opacity 1.2s ease, transform 1.2s ease;
    touch-action: manipulation;
}

#portada > img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#portada.oculta {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
}

#animacionGirasoles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
    overflow: visible;
}

.girasol-trazo {
    fill: none;
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation: dibujarGirasol 7s ease forwards;
}

.girasol-relleno {
    opacity: 0;
    animation: aparecerGirasol 7s ease forwards;
}

@keyframes dibujarGirasol {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes aparecerGirasol {
    to {
        opacity: 1;
    }
}

/* =========================
   CONTENIDO
========================= */

#contenido {
    position: relative;
    width: 100%;
    opacity: 0;
    visibility: hidden;
    transform: translateY(25px);
    transition: opacity 1.2s ease, transform 1.2s ease;
}

#contenido.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

/* =========================
   IMÁGENES
========================= */

.seccion {
    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
}

.seccion img {
    display: block;
    width: 100%;
    height: auto;
}

/* =========================
   GOOGLE MAPS
========================= */

#seccionDetalles {
    position: relative;
}

#zonaMapa {
    position: absolute;
    top: 82%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 88%;
    height: auto;
    min-height: 125px;
    padding: 14px 10px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.78);
    border: 2px solid #d5b66f;
    border-radius: 18px;

    color: #f5df9b;
    font-family: Georgia, serif;
    text-align: center;
    text-decoration: none;
    line-height: 1.3;
    letter-spacing: 1px;

    z-index: 30;
}

/* FLOR ANIMADA */

.flor-animada {
    display: block;
    font-size: 55px;
    line-height: 1.2;
    transform-origin: bottom center;
    animation: florMovimiento 1.5s infinite ease-in-out;
}

@keyframes florMovimiento {
    0%, 100% {
        transform: translateY(0) rotate(-8deg);
    }

    50% {
        transform: translateY(-12px) rotate(8deg);
    }
}

#zonaMapa strong {
    display: block;
    font-size: clamp(17px, 4vw, 23px);
    margin-top: 5px;
}

.texto-mapa {
    display: block;
    font-size: clamp(10px, 2.8vw, 14px);
    margin-top: 8px;
}

/* =========================
   CRONÓMETRO
========================= */

#seccionCronometro {
    position: relative;
}

.cronometro {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 92%;
    max-width: 650px;
    padding: 18px 12px;
    text-align: center;
    color: #76572c;
    background: rgba(255, 247, 232, .90);
    border-radius: 14px;
    z-index: 20;
    line-height: normal;
}

.cronometro h2 {
    font-family: Georgia, serif;
    font-size: clamp(18px, 4.5vw, 30px);
    margin-bottom: 8px;
}

.cronometro p {
    font-size: clamp(11px, 2.8vw, 14px);
    margin-bottom: 15px;
}

.contador {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 600px;
    margin: auto;
}

.bloque {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 4px;
    border-radius: 10px;
    background: #8b6938;
    color: white;
}

.numero {
    font-size: clamp(20px, 5.5vw, 38px);
    font-weight: bold;
    line-height: 1.2;
}

.texto {
    margin-top: 5px;
    font-size: clamp(8px, 2.2vw, 12px);
    font-weight: bold;
    letter-spacing: .4px;
}

/* =========================
   CRÉDITOS
========================= */

.creditos {
    width: 100%;
    text-align: center;
    background: #fff7e8;
    padding: 25px 15px 35px;
    color: #76572c;
    line-height: 1.6;
}

.creditos p {
    margin: 5px 0;
    font-size: 14px;
}

.creditos .marca {
    color: #9a742f;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
}

.creditos a {
    color: #76572c;
    text-decoration: none;
    font-weight: bold;
}

/* =========================
   BOTÓN DE MÚSICA
========================= */

#botonMusica {
    position: fixed;
    right: 15px;
    bottom: 15px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid #c9a45b;
    background: #80602c;
    color: white;
    font-size: 20px;
    z-index: 6000;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
}

/* =========================
   PÉTALOS BLANCOS
========================= */

#petalos {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3000;
    overflow: hidden;
}

.petalo {
    position: absolute;
    top: -20px;
    width: 13px;
    height: 15px;
    background: rgba(255,255,255,.85);
    border-radius: 80% 20% 80% 20%;
    animation: caer linear infinite;
    filter: blur(.2px);
}

@keyframes caer {
    0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 0;
    }

    10%, 90% {
        opacity: .9;
    }

    100% {
        transform: translateY(110vh) rotate(500deg);
        opacity: 0;
    }
}

/* =========================
   CELULARES
========================= */

@media(max-width:600px) {

    .cronometro {
        width: 94%;
        padding: 12px 7px;
    }

    .contador {
        gap: 5px;
    }

    .bloque {
        padding: 9px 2px;
    }

    #botonMusica {
        width: 42px;
        height: 42px;
        right: 12px;
        bottom: 12px;
    }

    #zonaMapa {
        width: 88%;
        min-height: 115px;
        padding: 10px 6px;
    }

    .flor-animada {
        font-size: 48px;
    }
}

</style>
</head>

<body>

<!-- =========================
     PORTADA
========================= -->

<div id="portada" role="button" aria-label="Abrir invitación">
    <img src="inicio.jpg" alt="Portada de la Calenda">

    <svg id="animacionGirasoles"
         viewBox="0 0 1000 1000"
         preserveAspectRatio="xMidYMid meet"
         aria-hidden="true">
    </svg>
</div>

<!-- MÚSICA -->

<audio id="musica" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="botonMusica"
        type="button"
        onclick="toggleMusica(event)"
        aria-label="Reproducir o pausar música">
    ♫
</button>

<!-- PÉTALOS -->

<div id="petalos"></div>

<!-- =========================
     INVITACIÓN
========================= -->

<main id="contenido">

    <section class="seccion">
        <img src="contexto.jpg"
             alt="Invitación y madrinas de la Calenda">
    </section>

    <!-- DETALLES Y UBICACIÓN -->

    <section class="seccion" id="seccionDetalles">

        <img src="detalles.jpg"
             alt="Detalles de la celebración">

        <a id="zonaMapa"
           href="https://maps.app.goo.gl/eKp26fpCn8pC46dM9?g_st=ac"
           target="_blank"
           rel="noopener noreferrer">

            <span class="flor-animada">🌻</span>

            <strong>PUNTO DE REUNIÓN</strong>

            <span class="texto-mapa">
                TOCA ESTA FLOR PARA VER LA UBICACIÓN
            </span>

        </a>

    </section>

    <!-- CRONÓMETRO -->

    <section class="seccion" id="seccionCronometro">

        <img src="cronometro.jpg" alt="Cuenta regresiva">

        <div class="cronometro">

            <h2>¡La espera está por terminar!</h2>

            <p>
                Nos vemos el 27 de noviembre de 2026
                a las 6:00 p. m.
            </p>

            <div class="contador">

                <div class="bloque">
                    <span class="numero" id="dias">0</span>
                    <span class="texto">DÍAS</span>
                </div>

                <div class="bloque">
                    <span class="numero" id="horas">00</span>
                    <span class="texto">HORAS</span>
                </div>

                <div class="bloque">
                    <span class="numero" id="minutos">00</span>
                    <span class="texto">MINUTOS</span>
                </div>

                <div class="bloque">
                    <span class="numero" id="segundos">00</span>
                    <span class="texto">SEGUNDOS</span>
                </div>

            </div>
        </div>

    </section>

    <!-- CRÉDITOS -->

    <footer class="creditos">

        <p>INVITACIÓN CREADA POR</p>

        <p class="marca">✦ MOON GRAFIK ✦</p>

        <p>
            WhatsApp:
            <a href="https://wa.me/524426070366"
               target="_blank"
               rel="noopener noreferrer">
                44 26 07 03 66
            </a>
        </p>

    </footer>

</main>

<script>

/* =========================
   ABRIR INVITACIÓN
========================= */

let invitacionAbierta = false;

function abrirInvitacion() {

    if (invitacionAbierta) return;

    invitacionAbierta = true;

    const portada = document.getElementById("portada");
    const contenido = document.getElementById("contenido");
    const musica = document.getElementById("musica");
    const boton = document.getElementById("botonMusica");

    // Iniciar música al tocar la portada

    musica.currentTime = 0;
    musica.volume = 1;

    musica.play().then(() => {
        boton.textContent = "♫";
    }).catch(error => {
        console.log("No se pudo iniciar la música:", error);
    });

    // Iniciar girasoles

    iniciarGirasoles();

    // Transición

    requestAnimationFrame(() => {
        portada.classList.add("oculta");
        contenido.classList.add("visible");
    });

    // Pétalos

    crearPetalos();

    // Retirar portada

    setTimeout(() => {
        portada.style.display = "none";
    }, 1300);

}

document.getElementById("portada")
    .addEventListener("click", abrirInvitacion);


/* =========================
   BOTÓN DE MÚSICA
========================= */

function toggleMusica(event) {

    event.stopPropagation();

    const musica = document.getElementById("musica");
    const boton = document.getElementById("botonMusica");

    if (musica.paused) {

        musica.play().then(() => {
            boton.textContent = "♫";
        }).catch(error => {
            console.log("No se pudo reproducir la música:", error);
        });

    } else {

        musica.pause();
        boton.textContent = "♪";

    }

}


/* =========================
   GIRASOLES GRANDES
========================= */

function iniciarGirasoles() {

    const svg = document.getElementById("animacionGirasoles");

    if (!svg || svg.dataset.iniciado === "si") return;

    svg.dataset.iniciado = "si";

    const NS = "http://www.w3.org/2000/svg";

    function crearElemento(tipo, atributos, clase, retraso) {

        const elemento = document.createElementNS(NS, tipo);

        Object.entries(atributos).forEach(([nombre, valor]) => {
            elemento.setAttribute(nombre, valor);
        });

        elemento.setAttribute("class", clase);
        elemento.style.animationDelay = retraso + "s";

        svg.appendChild(elemento);

    }

    const flores = [
        { x: 170, y: 290, escala: 1.35 },
        { x: 500, y: 230, escala: 1.55 },
        { x: 830, y: 290, escala: 1.35 }
    ];

    flores.forEach((flor, indice) => {

        const x = flor.x;
        const y = flor.y;
        const escala = flor.escala;
        const retraso = indice * 3;

        // Tallo

        crearElemento("path", {
            d: `M ${x} 1050 C ${x-35} 850, ${x+35} 650, ${x} ${y+65}`,
            stroke: "#228B22",
            "stroke-width": 18 * escala
        }, "girasol-trazo", retraso);

        // Hoja izquierda

        crearElemento("path", {
            d: `M ${x} 760 Q ${x-100} 660 ${x-145} 735 Q ${x-110} 830 ${x} 760 Z`,
            fill: "#228B22"
        }, "girasol-relleno", retraso + 1.5);

        crearElemento("path", {
            d: `M ${x} 760 Q ${x-75} 735 ${x-125} 735`,
            stroke: "#145214",
            "stroke-width": 4
        }, "girasol-trazo", retraso + 1.6);

        // Hoja derecha

        crearElemento("path", {
            d: `M ${x} 600 Q ${x+100} 490 ${x+145} 570 Q ${x+110} 670 ${x} 600 Z`,
            fill: "#228B22"
        }, "girasol-relleno", retraso + 1.9);

        crearElemento("path", {
            d: `M ${x} 600 Q ${x+80} 585 ${x+125} 570`,
            stroke: "#145214",
            "stroke-width": 4
        }, "girasol-trazo", retraso + 2);

        // Pétalos

        for (let i = 0; i < 16; i++) {

            const angulo = (Math.PI * 2 * i) / 16;

            const px = x + Math.cos(angulo) * 85 * escala;
            const py = y + Math.sin(angulo) * 85 * escala;

            crearElemento("ellipse", {
                cx: px,
                cy: py,
                rx: 48 * escala,
                ry: 19 * escala,
                fill: "#FFD700",
                stroke: "#E6B800",
                "stroke-width": 2,
                transform: `rotate(${angulo * 180 / Math.PI} ${px} ${py})`
            }, "girasol-relleno", retraso + 2.5 + i * 0.08);

        }

        // Centro de la flor

        crearElemento("circle", {
            cx: x,
            cy: y,
            r: 59 * escala,
            fill: "#8B4513"
        }, "girasol-relleno", retraso + 4);

        crearElemento("circle", {
            cx: x,
            cy: y,
            r: 34 * escala,
            fill: "#654321"
        }, "girasol-relleno", retraso + 4.2);

    });

}


/* =========================
   PÉTALOS BLANCOS
========================= */

function crearPetalos() {

    const contenedor = document.getElementById("petalos");

    if (!contenedor || contenedor.dataset.creados === "si") return;

    contenedor.dataset.creados = "si";

    for (let i = 0; i < 28; i++) {

        const petalo = document.createElement("div");

        petalo.className = "petalo";

        petalo.style.left = Math.random() * 100 + "%";

        petalo.style.animationDuration =
            (6 + Math.random() * 8) + "s";

        petalo.style.animationDelay =
            (Math.random() * 8) + "s";

        petalo.style.opacity =
            0.4 + Math.random() * 0.5;

        petalo.style.transform =
            `scale(${0.5 + Math.random()})`;

        contenedor.appendChild(petalo);

    }

}


/* =========================
   CUENTA REGRESIVA
========================= */

// 27 de noviembre de 2026 a las 6:00 p. m.

const fechaEvento =
    new Date(2026, 10, 27, 18, 0, 0).getTime();

function actualizarContador() {

    const diferencia = fechaEvento - Date.now();

    if (diferencia <= 0) {

        document.getElementById("dias").textContent = "0";
        document.getElementById("horas").textContent = "00";
        document.getElementById("minutos").textContent = "00";
        document.getElementById("segundos").textContent = "00";

        return;

    }

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia / (1000 * 60 * 60)) % 24
    );

    const minutos = Math.floor(
        (diferencia / (1000 * 60)) % 60
    );

    const segundos = Math.floor(
        (diferencia / 1000) % 60
    );

    document.getElementById("dias").textContent = dias;

    document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");

    document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");

    document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");

}

actualizarContador();

setInterval(actualizarContador, 1000);

</script>

</body>
</html>
