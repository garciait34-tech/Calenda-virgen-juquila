<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calenda en honor a la Virgen de Juquila</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #fffaf2;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

/* IMAGEN DE ENTRADA */
#inicio {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: #000;
  cursor: pointer;
  transition: opacity 1s ease, transform 1s ease;
}

#inicio img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#inicio.oculta {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

/* PORTADA Y GIRASOLES */
#portada {
  position: fixed;
  inset: 0;
  z-index: 9000;
  background: #000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease;
  overflow: hidden;
}

#portada.visible {
  opacity: 1;
  visibility: visible;
}

#portada > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#animacionGirasoles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#animacionGirasoles .trazo {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: dibujar 2s ease forwards;
}

#animacionGirasoles .relleno {
  opacity: 0;
  animation: aparecer .7s ease forwards;
}

@keyframes dibujar {
  to { stroke-dashoffset: 0; }
}

@keyframes aparecer {
  to { opacity: 1; }
}

/* CONTENIDO */
#contenido {
  opacity: 0;
  transform: translateY(25px);
  transition: opacity 1.2s ease, transform 1.2s ease;
  visibility: hidden;
}

#contenido.visible {
  opacity: 1;
  transform: translateY(0);
  visibility: visible;
}

.seccion {
  width: 100%;
  position: relative;
  line-height: 0;
}

.seccion img {
  display: block;
  width: 100%;
  height: auto;
}

/* PÉTALOS BLANCOS */
#petalos {
  position: fixed;
  inset: 0;
  z-index: 5000;
  overflow: hidden;
  pointer-events: none;
}

.petalo {
  position: absolute;
  top: -30px;
  width: 12px;
  height: 18px;
  background: rgba(255,255,255,.78);
  border-radius: 80% 20% 80% 20%;
  animation: caer linear infinite;
  filter: blur(.2px);
}

@keyframes caer {
  0% {
    transform: translateY(-30px) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: .9; }
  100% {
    transform: translateY(110vh) rotate(500deg);
    opacity: 0;
  }
}

/* MÚSICA */
#botonMusica {
  position: fixed;
  right: 16px;
  bottom: 18px;
  z-index: 7000;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #80602c;
  color: white;
  font-size: 21px;
  cursor: pointer;
  box-shadow: 0 3px 12px #0004;
}

/* CONTADOR */
#contador {
  width: 100%;
  padding: 35px 12px;
  text-align: center;
  background: #fff7e8;
  color: #735127;
  line-height: normal;
}

#contador h2 {
  font-size: clamp(22px, 5vw, 34px);
  margin-bottom: 22px;
}

.reloj {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

.tiempo {
  min-width: 65px;
  padding: 13px 9px;
  background: #8d6b36;
  color: white;
  border-radius: 10px;
}

.tiempo strong {
  display: block;
  font-size: clamp(22px, 5vw, 32px);
}

.tiempo span {
  font-size: 12px;
}

/* MAPA: AJUSTAR POSICIÓN CUANDO VEAMOS detalles.jpg */
#zonaMapa {
  position: absolute;
  left: 50%;
  top: 80%;
  width: 18%;
  height: 13%;
  transform: translate(-50%, -50%);
  display: block;
  z-index: 2;
}

/* PIE */
footer {
  padding: 28px 12px;
  text-align: center;
  line-height: 1.6;
  color: #735127;
  background: #fff7e8;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

footer strong {
  display: block;
  letter-spacing: 3px;
  font-size: 19px;
}

footer a {
  color: inherit;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- IMAGEN PARA ENTRAR -->
<div id="inicio" onclick="abrirInvitacion()">
  <img src="inicio.jpg" alt="Toca para abrir la invitación">
</div>

<!-- PORTADA CON GIRASOLES -->
<div id="portada">
  <img src="portada.jpg" alt="Portada de la calenda">
  <svg id="animacionGirasoles" viewBox="0 0 1000 1000"
       preserveAspectRatio="xMidYMid meet"></svg>
</div>

<!-- CONTENIDO DE LA INVITACIÓN -->
<main id="contenido">

  <section class="seccion">
    <img src="contexto.jpg" alt="Invitación a la calenda">
  </section>

  <section class="seccion" id="seccionDetalles">
    <img src="detalles.jpg" alt="Detalles de la celebración">
    <a id="zonaMapa"
       href="https://goo.gl/maps/825JtysoS72kmZEv5?g_st=ac"
       target="_blank"
       rel="noopener"
       aria-label="Abrir ubicación en Google Maps"></a>
  </section>

  <section id="contador">
    <h2>¡Falta muy poco para nuestra celebración!</h2>
    <div class="reloj">
      <div class="tiempo">
        <strong id="dias">00</strong>
        <span>DÍAS</span>
      </div>
      <div class="tiempo">
        <strong id="horas">00</strong>
        <span>HORAS</span>
      </div>
      <div class="tiempo">
        <strong id="minutos">00</strong>
        <span>MINUTOS</span>
      </div>
      <div class="tiempo">
        <strong id="segundos">00</strong>
        <span>SEGUNDOS</span>
      </div>
    </div>
  </section>

  <footer>
    INVITACIÓN CREADA POR
    <strong>MOON GRAFIK</strong>
    <a href="https://wa.me/524426070366" target="_blank" rel="noopener">
      WhatsApp: 44 26 07 03 66
    </a>
  </footer>

</main>

<!-- PÉTALOS -->
<div id="petalos"></div>

<!-- MÚSICA -->
<audio id="musica" src="musica.mp3" loop preload="auto"></audio>
<button id="botonMusica" onclick="toggleMusica(event)" aria-label="Pausar o reproducir música">♫</button>

<script>
/* ABRIR INVITACIÓN */
let abierta = false;

function abrirInvitacion() {
  if (abierta) return;
  abierta = true;

  const inicio = document.getElementById("inicio");
  const portada = document.getElementById("portada");
  const musica = document.getElementById("musica");

  musica.play().then(() => {
    document.getElementById("botonMusica").textContent = "♫";
  }).catch(() => {});

  inicio.classList.add("oculta");

  setTimeout(() => {
    inicio.style.display = "none";
    portada.classList.add("visible");
    iniciarGirasoles();
  }, 900);

  setTimeout(() => {
    portada.classList.remove("visible");
    document.getElementById("contenido").classList.add("visible");
    crearPetalos();
    window.scrollTo(0, 0);
  }, 6500);
}

/* MÚSICA */
function toggleMusica(event) {
  event.stopPropagation();
  const musica = document.getElementById("musica");
  const boton = document.getElementById("botonMusica");

  if (musica.paused) {
    musica.play();
    boton.textContent = "♫";
  } else {
    musica.pause();
    boton.textContent = "♪";
  }
}

/* CREAR GIRASOLES ANIMADOS */
function iniciarGirasoles() {
  const svg = document.getElementById("animacionGirasoles");
  if (svg.dataset.iniciado) return;
  svg.dataset.iniciado = "si";

  const NS = "http://www.w3.org/2000/svg";

  function elemento(tipo, atributos, clase, retraso) {
    const el = document.createElementNS(NS, tipo);
    Object.entries(atributos).forEach(([k,v]) => {
      el.setAttribute(k, v);
    });
    if (clase) el.setAttribute("class", clase);
    if (retraso !== undefined) {
      el.style.animationDelay = retraso + "s";
    }
    svg.appendChild(el);
    return el;
  }

  const flores = [
    {x:200, y:350, escala:1},
    {x:500, y:300, escala:1.05},
    {x:800, y:350, escala:1}
  ];

  flores.forEach((flor, indice) => {
    const x = flor.x;
    const y = flor.y;
    const escala = flor.escala;
    const inicio = indice * .7;

    /* TALLO */
    elemento("path", {
      d:`M ${x} 900 Q ${x-12} 650 ${x} ${y+30}`,
      stroke:"#228B22",
      "stroke-width":13 * escala,
      fill:"none"
    }, "trazo", inicio);

    /* HOJAS */
    elemento("path", {
      d:`M ${x} 700 Q ${x-90} 620 ${x-110} 690 Q ${x-75} 755 ${x} 700 Z`,
      fill:"#228B22"
    }, "relleno", inicio + 1.1);

    elemento("path", {
      d:`M ${x} 700 Q ${x-60} 680 ${x-95} 690`,
      stroke:"#145214",
      "stroke-width":3,
      fill:"none"
    }, "trazo", inicio + 1.2);

    elemento("path", {
      d:`M ${x} 610 Q ${x+85} 530 ${x+110} 590 Q ${x+90} 655 ${x} 610 Z`,
      fill:"#228B22"
    }, "relleno", inicio + 1.4);

    elemento("path", {
      d:`M ${x} 610 Q ${x+60} 600 ${x+95} 590`,
      stroke:"#145214",
      "stroke-width":3,
      fill:"none"
    }, "trazo", inicio + 1.5);

    /* PÉTALOS */
    for (let i=0; i<12; i++) {
      const angulo = (Math.PI * 2 * i) / 12;
      const px = x + Math.cos(angulo) * 62 * escala;
      const py = y + Math.sin(angulo) * 62 * escala;

      const petalo = elemento("ellipse", {
        cx:px,
        cy:py,
        rx:36 * escala,
        ry:12 * escala,
        fill:"#FFD700",
        transform:`rotate(${angulo * 180 / Math.PI} ${px} ${py})`
      }, "relleno", inicio + 2 + i * .12);

      petalo.style.transformBox = "fill-box";
      petalo.style.transformOrigin = "center";
    }

    /* CENTRO CAFÉ */
    elemento("circle", {
      cx:x, cy:y, r:45 * escala, fill:"#8B4513"
    }, "relleno", inicio + 3.7);

    elemento("circle", {
      cx:x, cy:y, r:25 * escala, fill:"#654321"
    }, "relleno", inicio + 4);
  });
}

/* PÉTALOS BLANCOS CAYENDO */
function crearPetalos() {
  const contenedor = document.getElementById("petalos");
  if (contenedor.dataset.creados) return;
  contenedor.dataset.creados = "si";

  for (let i=0; i<28; i++) {
    const petalo = document.createElement("div");
    petalo.className = "petalo";
    petalo.style.left = Math.random() * 100 + "%";
    petalo.style.animationDuration = (6 + Math.random() * 8) + "s";
    petalo.style.animationDelay = (Math.random() * 8) + "s";
    petalo.style.opacity = .4 + Math.random() * .5;
    petalo.style.transform = `scale(${.5 + Math.random()})`;
    contenedor.appendChild(petalo);
  }
}

/* CUENTA REGRESIVA: 27 NOVIEMBRE 2026, 18:00 */
const fechaEvento = new Date(2026, 10, 27, 18, 0, 0).getTime();

function actualizarContador() {
  const ahora = Date.now();
  const diferencia = fechaEvento - ahora;

  if (diferencia <= 0) {
    document.getElementById("dias").textContent = "00";
    document.getElementById("horas").textContent = "00";
    document.getElementById("minutos").textContent = "00";
    document.getElementById("segundos").textContent = "00";
    return;
  }

  document.getElementById("dias").textContent =
    Math.floor(diferencia / (1000 * 60 * 60 * 24));

  document.getElementById("horas").textContent =
    Math.floor((diferencia / (1000 * 60 * 60)) % 24);

  document.getElementById("minutos").textContent =
    Math.floor((diferencia / (1000 * 60)) % 60);

  document.getElementById("segundos").textContent =
    Math.floor((diferencia / 1000) % 60);
}

actualizarContador();
setInterval(actualizarContador, 1000);
</script>

</body>
</html>
